<title>VME Precast — 3D Rebar Reconstruction</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#14181d; --muted:#5d6875; --line:#dfe4ea;
  --accent:#1b6ac9; --ok:#177245; --warn:#9a6700;
  --d8:#2f7ed8; --d10:#1f9e4b; --d12:#d1495b; --d16:#8250c4; --d20:#e07b1a; --d25:#8c564b; --d32:#444;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1216; --panel:#171b21; --ink:#e7ecf2; --muted:#93a0b0; --line:#262d36;
  --accent:#5fa8ff; --ok:#4bbf7a; --warn:#e0b341;
  --d8:#5fa8ff; --d10:#4bbf7a; --d12:#ff6b7f; --d16:#b18cf0; --d20:#ffa040; --d25:#c08a6a; --d32:#aab;
}}
:root[data-theme="dark"]{
  --bg:#0f1216; --panel:#171b21; --ink:#e7ecf2; --muted:#93a0b0; --line:#262d36;
  --accent:#5fa8ff; --ok:#4bbf7a; --warn:#e0b341;
  --d8:#5fa8ff; --d10:#4bbf7a; --d12:#ff6b7f; --d16:#b18cf0; --d20:#ffa040; --d25:#c08a6a; --d32:#aab;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:19px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;height:calc(100vh - 74px)}
@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}}
#stage{position:relative;background:var(--panel);min-height:520px}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
.side{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:16px}
@media(max-width:900px){.side{border-left:0;border-top:1px solid var(--line);max-height:70vh}}
.hud{position:absolute;left:14px;top:14px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--muted);background:color-mix(in srgb,var(--panel) 84%,transparent);
  padding:8px 10px;border:1px solid var(--line);border-radius:8px;pointer-events:none}
.ctl{position:absolute;right:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
button,select{font:inherit;font-size:12px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  margin:20px 0 8px;font-weight:600}
h2:first-child{margin-top:0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.kpi b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:5px 4px}
td{padding:4px;border-bottom:1px solid var(--line)}
tbody tr{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
tbody tr[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:baseline}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:8px 0}
.tag{font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.ok{color:var(--ok)} .warn{color:var(--warn)}
.scroll{max-height:340px;overflow-y:auto}
</style>
<header>
  <h1>VME Precast — 3D Rebar Reconstruction</h1>
  <div class="sub">Every bar from the verified <b>(S)</b> bar bending schedules, placed using the <b>(R)</b> reinforcement drawings.</div>
</header>
<div class="wrap">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div class="hud" id="hud"></div>
    <div class="ctl">
      <select id="panel"></select>
      <button id="bfit">Fit</button>
      <button id="bspin" aria-pressed="false">Spin</button>
      <button id="bbox" aria-pressed="true">Outline</button>
    </div>
  </div>
  <div class="side">
    <h2>This panel</h2>
    <div class="kpis" id="kpis"></div>
    <div class="legend" id="legend" style="margin-top:10px"></div>
    <h2>Bar bending schedule</h2>
    <div class="scroll"><table id="tbl">
      <thead><tr><th>Mark</th><th>Dia</th><th>Shape</th><th>Length</th><th>No.</th><th>Weight</th></tr></thead>
      <tbody></tbody></table></div>
    <div class="note" id="prov"></div>
    <h2>Whole set</h2>
    <div class="kpis" id="tot"></div>
    <div class="note" id="footnote"></div>
  </div>
</div>
